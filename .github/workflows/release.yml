# Builds the image trio and publishes it as a GitHub release, and keeps every
# output as a build artifact. Releases are lynx-only by default (the `devices`
# input and the matrix fallback below).
#
# Triggers:
#   - push of a tag vX.Y.Z (release-please's tags count only if it runs with a
#     PAT, RELEASE_PLEASE_TOKEN: tags and releases made with GITHUB_TOKEN do not
#     trigger other workflows).
#   - a published release, e.g. one release-please created. Its assets are added
#     to that release.
#   - manually (Actions tab → release → Run workflow): pick the branch, the tag
#     to publish under, the runner and the devices. The tag is created at the
#     commit that was built if it does not exist yet.
#
# Jobs:
#   mesa     builds the open GPU userspace (tools/build-mesa.sh) natively on an
#            arm64 runner, in debian:trixie (the image's release). Artifact
#            mesa-arm64.
#   build    one per device: `just <device>` from scratch (kernel, rootfs, boot
#            images, super.img) with MESA_PREBUILT set to mesa's tarball, then
#            tools/release-assets.sh. Artifacts: release-<device> (the release
#            assets), kernel-<device> (the kernel dist), build-log-<device>.
#   publish  creates or updates the release from the artifacts.
#
# ★ Runner. A device build needs ~30 GB of disk and hours of CPU. A
#   GitHub-hosted runner (6 h job limit) manages lynx; the job reclaims disk and
#   builds on /mnt. Pick a self-hosted runner where one exists: the manual run's
#   `runner` input, or the repository variable RELEASE_RUNNER.
#
# ★ The release tag. GITHUB_TOKEN may not create a ref on a commit whose
#   .github/workflows differ from the default branch's: GitHub answers the
#   release API with "403 Resource not accessible by integration". So build the
#   default branch's current head (and don't change the workflows while it
#   runs), push the tag yourself, or add a RELEASE_TOKEN secret (a PAT with
#   contents + workflows write), which publish uses when it exists.

name: release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (created at the built commit if it does not exist)"
        type: string
        required: true
      runner:
        description: "Where to run the device builds"
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - x86-kernel-builder-atkinson
      devices:
        description: "Devices to build (JSON list)"
        type: string
        # felix is left out of releases: its build has died on a GitHub-hosted
        # runner with no log. Add it here (or pass it) to build it.
        default: '["lynx"]'
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: true

permissions:
  contents: write

# One release per tag at a time; a second run for the same tag waits.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

jobs:
  mesa:
    name: mesa (arm64)
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    timeout-minutes: 120
    steps:
      - name: Install git
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates zstd >/dev/null

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Build Mesa
        run: |
          export MESA_URL=$(sed -n 's/^MESA_URL ?= //p' Makefile)
          export MESA_REV=$(sed -n 's/^MESA_REV ?= //p' Makefile)
          echo "Mesa $MESA_URL @ $MESA_REV"
          tools/build-mesa.sh fetch "$RUNNER_TEMP/mesa-src"
          tools/build-mesa.sh build "$RUNNER_TEMP/mesa-src" "$RUNNER_TEMP/mesa-build" "$RUNNER_TEMP/mesa-out"
          mkdir -p mesa-artifact
          tools/build-mesa.sh pack "$RUNNER_TEMP/mesa-out" "mesa-artifact/mesa-arm64-$MESA_REV.tar.zst"
          ls -l mesa-artifact

      - uses: actions/upload-artifact@v5
        with:
          name: mesa-arm64
          path: mesa-artifact/
          retention-days: 30
          compression-level: 0

  build:
    name: build ${{ matrix.device }}
    needs: mesa
    runs-on: ${{ inputs.runner || vars.RELEASE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 360
    strategy:
      fail-fast: true
      matrix:
        device: ${{ fromJSON(inputs.devices || '["lynx"]') }}
    steps:
      # ubuntu-latest has little free space on / and a large ephemeral disk at
      # /mnt. Drop the preinstalled toolchains we never use.
      - name: Free up disk space on the root volume
        if: runner.environment == 'github-hosted'
        run: |
          echo "Before:"; df -h / /mnt
          sudo rm -rf \
            /opt/hostedtoolcache \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/local/.ghcup \
            /opt/ghc \
            /usr/local/share/boost \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "After:"; df -h / /mnt

      # Put the workspace (kernel trees, build/, rootfs.img) on /mnt.
      - name: Mount the workspace on /mnt
        if: runner.environment == 'github-hosted'
        run: |
          mkdir -p a
          sudo mkdir -p /mnt/overlay/upper /mnt/overlay/work
          sudo chown "$(id -u):$(id -g)" /mnt/overlay/upper /mnt/overlay/work
          sudo mount -t overlay overlay \
            -o lowerdir="$PWD/a",upperdir=/mnt/overlay/upper,workdir=/mnt/overlay/work,volatile \
            "$PWD"

      - uses: actions/checkout@v5
        with:
          # pixel-bootctl, pixel-ota and mkbootimg are submodules the image needs.
          submodules: recursive
          # The tag on tag/release runs, the chosen branch on manual runs.
          ref: ${{ github.event.release.tag_name || github.ref }}
          # IMAGE_VERSION is version.txt + `git describe`-style revision.
          fetch-depth: 0

      - uses: ./.github/actions/build-host

      - uses: actions/download-artifact@v5
        with:
          name: mesa-arm64
          path: ${{ runner.temp }}/mesa

      - name: Build ${{ matrix.device }}
        run: |
          export MESA_PREBUILT=$(ls "$RUNNER_TEMP"/mesa/mesa-arm64-*.tar.zst)
          $(command -v eatmydata || true) just ${{ matrix.device }} 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"

      - name: Package release assets
        run: |
          tools/release-assets.sh ${{ matrix.device }} release-assets
          cp "$RUNNER_TEMP"/mesa/mesa-arm64-*.tar.zst release-assets/

      - name: Collect the kernel dist
        run: |
          d=${{ matrix.device }}
          mkdir -p kernel-artifact
          cp -a "kernel/source-$d/out/$d/dist"/. kernel-artifact/
          cp "kernel/kernel_version.$d" kernel-artifact/kernel_version

      - uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.device }}
          path: release-assets/
          retention-days: 30
          compression-level: 0

      - uses: actions/upload-artifact@v5
        with:
          name: kernel-${{ matrix.device }}
          path: kernel-artifact/
          retention-days: 30

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: build-log-${{ matrix.device }}
          path: build.log
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Write release notes
        run: |
          {
            echo "Images built by \`just <device>\` at ${GITHUB_SHA::12}."
            echo
            echo "| Device | Image version |"
            echo "| --- | --- |"
            for v in release-assets/*-image-version; do
              d=$(basename "$v" -image-version)
              echo "| $d | \`$(cat "$v")\` |"
            done
            echo
            echo "### Flashing with fastboot"
            echo
            echo "Download one device's assets into a directory, then:"
            echo
            echo '```bash'
            echo 'd=lynx'
            echo 'for p in $d-*.part00; do [ -e "$p" ] && cat "${p%.part00}".part* > "${p%.part00}"; done'
            echo 'zstd -d $d-rootfs.img.zst $d-super.img.zst'
            echo 'sha256sum -c --ignore-missing $d-SHA256SUMS'
            echo 'mkdir -p images'
            echo 'for f in boot vendor_boot dtbo rootfs super; do mv $d-$f.img images/$f.img; done'
            echo 'DEVICE=$d IMAGE_DIR=images DTBO=images/dtbo.img ./flash-fastboot.sh <serial>'
            echo '```'
            echo
            echo "\`flash-fastboot.sh\` is in this repository at the tagged commit. It erases \`super\`."
            echo "\`*-SHA256SUMS\` lists both the uncompressed images (as \`<device>-<name>.img\`) and every asset."
            echo
            echo "### GPU"
            echo
            echo "The images use the upstream panthor kernel driver and Mesa (panvk Vulkan, rusticl OpenCL)."
            echo "\`mesa-arm64-<rev>.tar.zst\` is that Mesa build on its own: \`root/\` installs at \`/\`."
          } > notes.md
          cat notes.md
          ls -l release-assets

      # See "The release tag" at the top. Fail with that explanation instead
      # of a bare 403 when the tag would have to be created on a commit whose
      # workflows differ from the default branch's.
      - name: Check the release tag can be created
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          HAS_PAT: ${{ secrets.RELEASE_TOKEN != '' }}
        run: |
          if [ "$HAS_PAT" = true ] || gh release view "$TAG" >/dev/null 2>&1 \
             || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            exit 0
          fi
          def=${{ github.event.repository.default_branch }}
          git fetch -q origin "$def"
          if [ "$(git rev-parse "$GITHUB_SHA:.github/workflows")" != "$(git rev-parse "FETCH_HEAD:.github/workflows")" ]; then
            echo "::error::$GITHUB_SHA's .github/workflows differ from $def's, so GITHUB_TOKEN cannot create tag $TAG there. Re-run from $def's head, push the tag yourself, or add a RELEASE_TOKEN secret. The images are in this run's release-* artifacts."
            exit 1
          fi

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          # Manual runs: the input. Tag and release runs: a tag with a suffix
          # (v1.8.0-rc1) is a pre-release.
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && (inputs.prerelease && 'true' || 'false') || (contains(env.TAG, '-') && 'true' || 'false') }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            flags=()
            [ "$PRERELEASE" = true ] && flags+=(--prerelease)
            gh release create "$TAG" release-assets/* \
              --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md "${flags[@]}"
          fi
