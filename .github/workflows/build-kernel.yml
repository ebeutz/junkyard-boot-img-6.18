# Builds a device's kernel, out-of-tree modules and device tree (plain kbuild,
# kernel/kbuild.mk) and uploads the dist as a build artifact.
#
# Runs on every push to main that touches the kernel's inputs, and by hand from
# the Actions tab (pick the device and the runner). The artifact,
# kernel-<device>, holds exactly what the rootfs/boot stages consume: Image(.lz4),
# System.map, dtb.img, dtbo.img, the dtbs, the vendor_dlkm/system_dlkm staging
# archives, the *.modules.load lists, kernel headers, and kernel_version.

name: build-kernel

on:
  push:
    branches:
      - main
    paths:
      - "kernel/**"
      - "devices/**"
      - "tools/bazel2kbuild.py"
      - "tools/kconfig-check-fragments.sh"
      - "tools/kernel-drift.sh"
      - "tools/mkdtboimg.py"
      - "tools/modules-load-lists.py"
      - ".github/workflows/build-kernel.yml"
      - ".github/actions/build-host/**"
  workflow_dispatch:
    inputs:
      device:
        description: "Device whose kernel to build"
        type: choice
        default: lynx
        options:
          - lynx
          - felix
      runner:
        description: "Where to run the build"
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - x86-kernel-builder-atkinson

permissions:
  contents: read

jobs:
  build:
    name: kernel ${{ inputs.device || 'lynx' }}
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 300
    env:
      DEVICE: ${{ inputs.device || 'lynx' }}
    steps:
      # ubuntu-latest has little free space on / and a large ephemeral disk at
      # /mnt. Drop the preinstalled toolchains we never use.
      - name: Free up disk space on the root volume
        if: runner.environment == 'github-hosted'
        run: |
          echo "Before:"; df -h / /mnt
          sudo rm -rf \
            /opt/hostedtoolcache \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/local/.ghcup \
            /opt/ghc \
            /usr/local/share/boost \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "After:"; df -h / /mnt

      # Put the workspace (the kernel checkout and its build output) on /mnt.
      - name: Mount the workspace on /mnt
        if: runner.environment == 'github-hosted'
        run: |
          mkdir -p a
          sudo mkdir -p /mnt/overlay/upper /mnt/overlay/work
          sudo chown "$(id -u):$(id -g)" /mnt/overlay/upper /mnt/overlay/work
          sudo mount -t overlay overlay \
            -o lowerdir="$PWD/a",upperdir=/mnt/overlay/upper,workdir=/mnt/overlay/work,volatile \
            "$PWD"

      - uses: actions/checkout@v5

      - uses: ./.github/actions/build-host

      - name: Build the ${{ env.DEVICE }} kernel
        run: |
          just device="$DEVICE" build_kernel 2>&1 | tee build-kernel.log
          exit "${PIPESTATUS[0]}"

      - name: Collect the dist
        run: |
          dist="kernel/source-$DEVICE/out/$DEVICE/dist"
          mkdir -p artifact
          cp -a "$dist"/. artifact/
          cp "kernel/kernel_version.$DEVICE" artifact/kernel_version
          ls -la artifact

      - uses: actions/upload-artifact@v5
        with:
          name: kernel-${{ env.DEVICE }}
          path: artifact/
          retention-days: 30

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: build-kernel-log-${{ env.DEVICE }}
          path: build-kernel.log
          retention-days: 14
