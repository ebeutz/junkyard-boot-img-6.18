# Build-host setup shared by build-kernel.yml and release.yml: the tools
# CLAUDE.md "Build-host prerequisites" lists, on a GitHub-hosted Ubuntu runner.
# A self-hosted runner is expected to have them already, so most steps are
# skipped there.
#
# Run it after actions/checkout (a local action is read from the checkout).
name: build-host
description: Install the kernel/rootfs build prerequisites

runs:
  using: composite
  steps:
    # `repo init` (felix's kernel checkout) wants a git identity.
    - name: Git identity
      shell: bash
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

    # The justfile `require()`s repo, debootstrap, rsync, fallocate, mkfs.ext4,
    # curl, unzip and make before any recipe runs, so even a kernel-only job
    # needs the rootfs tools.
    - name: Install build dependencies
      if: runner.environment == 'github-hosted'
      shell: bash
      run: |
        sudo rm -f /var/lib/man-db/auto-update
        sudo apt-get update
        sudo apt-get install -y eatmydata
        sudo eatmydata apt-get install -y \
          just repo debootstrap systemd-container qemu-user-binfmt \
          e2fsprogs kmod rsync curl unzip xxd zstd util-linux \
          flex bison bc perl python3 cpio lz4 libssl-dev libelf-dev libdw-dev \
          zlib1g-dev cmake
        # The rootfs stages run aarch64 binaries in the sysroot.
        test -e /proc/sys/fs/binfmt_misc/qemu-aarch64 || sudo systemctl restart systemd-binfmt
        cat /proc/sys/fs/binfmt_misc/qemu-aarch64

    # The justfile uses require() (just >= 1.39). Ubuntu's just is normally
    # new enough; if it is not, fetch a release with just's installer, which
    # is a third-party download that has answered 403 now and then, so retry.
    - name: Ensure just >= 1.39
      if: runner.environment == 'github-hosted'
      shell: bash
      run: |
        ok() { command -v just >/dev/null && printf '1.39.0\n%s\n' "$(just --version | cut -d' ' -f2)" | sort -C -V; }
        if ! ok; then
          for i in 1 2 3 4 5; do
            curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
              | sudo bash -s -- --to /usr/local/bin && break
            sleep $((i * 10))
          done
        fi
        hash -r
        just --version
        ok

    # kernel/kbuild.mk needs pahole >= 1.27 for BTF. Use Ubuntu's (dwarves) if
    # it is new enough; otherwise build v1.30, from git.kernel.org or, if that
    # does not answer, its GitHub mirror.
    - name: pahole >= 1.27
      if: runner.environment == 'github-hosted'
      shell: bash
      run: |
        sudo apt-get install -y dwarves || true
        ok() { command -v "$1" >/dev/null && printf '1.27\n%s\n' "$("$1" --version | tr -d v)" | sort -C -V; }
        if ok pahole; then
          echo "PAHOLE=$(command -v pahole)" >> "$GITHUB_ENV"
          pahole --version
          exit 0
        fi
        src="$RUNNER_TEMP/pahole"
        for i in 1 2 3; do
          for url in https://git.kernel.org/pub/scm/devel/pahole/pahole.git https://github.com/acmel/dwarves.git; do
            rm -rf "$src"
            git clone --depth 1 --branch v1.30 --recurse-submodules --shallow-submodules "$url" "$src" && break 2
          done
          sleep $((i * 20))
        done
        cmake -S "$src" -B "$src/build" \
          -DCMAKE_BUILD_TYPE=Release -D__LIB=lib -DCMAKE_INSTALL_PREFIX=/usr/local
        make -C "$src/build" -j"$(nproc)"
        sudo make -C "$src/build" install
        sudo ldconfig
        echo "PAHOLE=/usr/local/bin/pahole" >> "$GITHUB_ENV"
        ok /usr/local/bin/pahole
        /usr/local/bin/pahole --version

    # pixel-bootctl / pixel-ota are static aarch64-musl binaries linked with
    # rust-lld (see .build_pixel_bootctl in the Makefile).
    - name: Rust target
      shell: bash
      run: |
        command -v rustup >/dev/null || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        "$HOME/.cargo/bin/rustup" target add aarch64-unknown-linux-musl
